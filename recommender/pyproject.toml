[project]
name = "recomendacao-fbc"
version = "0.1.0"
description = "Sistema de recomendação por Filtragem Baseada em Conteúdo (TF-IDF + similaridade do cosseno)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.8.1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.32.0",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]
